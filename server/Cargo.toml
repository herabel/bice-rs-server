[package]
name = "password-manager-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version = "0.8.8", features = ["tokio", "macros"]}
getrandom = "0.4.2"
serde_json = "1.0.149"
tiny-keccak = {version = "2.0.2", features = ["shake"]}
tokio = {version = "1.50.0", features = ["rt-multi-thread"]}
uuid = {version = "1.23.0", features = ["serde", "v4"]}
serde = { version = "1.0.228", features = ["derive"]}
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
chacha20poly1305 = "0.10.1"
argon2 = "0.5.3"
hex = "0.4.3"
dotenv = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
x25519-dalek = "2.0.1"
pqcrypto-kyber = "0.8.1"
rand_core = { version = "0.10", default-features = false }
rand_core_06 = { package = "rand_core", version = "0.6" }
pqcrypto-traits = "0.3.5"
serde_bytes = "0.11.19"
redis = { version = "1.2.0", features = ["aio", "tokio-comp"]}
postcard = {version = "1.1.3", features = ["alloc"]}
